<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เสียงคนดูแล</title>
<meta name="description" content="แบบสอบถามสั้นเรื่องการดูแลผู้สูงอายุที่บ้าน ใช้เวลาประมาณ 5 นาที ไม่ต้องใส่ชื่อ">
<meta property="og:title" content="เสียงคนดูแล — ช่วยเล่าเรื่องการดูแลผู้สูงอายุที่บ้าน">
<meta property="og:description" content="5 นาที ไม่ต้องใส่ชื่อ ตอบได้ทั้งคนดูแล ผู้สูงอายุ ผู้ดูแลอาชีพ และลูกหลาน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, calm, respectful — a kind volunteer with a clipboard
   IDEA: a weekly pill organizer — compartments fill as you answer
   PICTURE: one question per screen, big tappable answers
   COLOUR and TYPE: white ground, lacquer red, soft rose; Anuphan + IBM Plex Sans Thai Looped
   LAYOUT: one calm column; elder mode scales everything up */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#161213);--ink:light-dark(#1f1a1a,#f3ecec);--mute:light-dark(#6b6060,#b8aaaa);
--soft:light-dark(#f7eeee,#2a2022);--line:light-dark(#e3d4d4,#3d3133);--red:light-dark(#b3261e,#f0716a);
--redink:light-dark(#ffffff,#1a0c0b);--card:light-dark(#ffffff,#1e1819);--fs:17px;--opt:56px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html.big{--fs:21px;--opt:68px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.6 "IBM Plex Sans Thai Looped",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Anuphan,system-ui,sans-serif;line-height:1.22;text-wrap:balance;margin:0 0 .35em}
h1{font-size:clamp(30px,6.4vw,44px)}h2{font-size:calc(var(--fs) * 1.5)}h3{font-size:19px}
.wrap{max-width:620px;margin:0 auto;padding:clamp(16px,4vw,36px) 18px 130px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.brand{font-family:Anuphan;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--red)}
.aa{min-height:40px;font-size:15px;padding:0 14px;border-radius:99px}
.small{font-size:14px;color:var(--mute)}
.pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 26px;height:14px}
.pills span{border-radius:7px;background:var(--soft);border:1px solid var(--line);position:relative;overflow:hidden}
.pills span i{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);transition:transform .3s}
.hero{background:var(--soft);border-radius:22px;padding:clamp(22px,5vw,34px);margin-bottom:18px}
.hero p{margin:.4em 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px;padding:0;list-style:none}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:15px}
.kick{font-size:14px;color:var(--red);font-weight:600;margin:0 0 6px}
.hint{font-size:calc(var(--fs) * .88);color:var(--mute);margin:-4px 0 14px}
.opts{display:grid;gap:9px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.opt>span{display:flex;align-items:center;gap:12px;min-height:var(--opt);padding:10px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .15s,background .15s}
.opt>span::before{content:"";flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:50%}
.opt input[type=checkbox]+span::before{border-radius:7px}
.opt input:checked+span{border-color:var(--red);background:var(--soft)}
.opt input:checked+span::before{background:var(--red);border-color:var(--red);box-shadow:inset 0 0 0 3px var(--card)}
.opt input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.opt input:disabled+span{opacity:.4}
@media (hover:hover){.opt:hover>span{border-color:var(--red)}}
.roles{display:grid;gap:10px}
.roles .opt>span{min-height:86px;align-items:center}
.roles .opt>span::before{display:none}
.roles svg{flex:none;width:44px;height:44px;color:var(--red)}
.roles b{display:block;font-family:Anuphan;font-size:calc(var(--fs) * 1.12)}
.roles em{display:block;font-style:normal;font-size:calc(var(--fs) * .84);color:var(--mute);line-height:1.4}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.scale .opt>span{justify-content:center;font-family:Anuphan;font-weight:600;font-size:22px;min-height:64px;padding:0}
.scale .opt>span::before{display:none}
.scale .opt input:checked+span{background:var(--red);color:var(--redink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute);margin-top:6px}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
input{font-size:max(16px,var(--fs))!important}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red)}
.mt{margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-family:Anuphan;font-weight:600;font-size:18px;min-height:54px;border-radius:16px;padding:0 22px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button.go{flex:1;background:var(--red);border-color:var(--red);color:var(--redink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:15px;min-height:1.4em;margin:12px 0 0}
#screen{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#screen{animation:none}.pills span i{transition:none}}
.done{text-align:center;padding-top:24px}
.done .big{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.share a{display:inline-flex;align-items:center;min-height:54px;padding:0 22px;border-radius:16px;background:#06c755;color:#fff;font-family:Anuphan;font-weight:600;text-decoration:none}
/* team */
.team{max-width:1120px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.tabs button{min-height:44px;font-size:16px;border-radius:99px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.kpi{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:15px}
.kpi b{display:block;font-family:Anuphan;font-size:clamp(26px,5vw,34px);line-height:1.1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.panel{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:var(--card)}
.panel h3{font-size:17px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px;align-items:end;margin:9px 0;font-size:15px}
.row .lab{display:flex;flex-direction:column;gap:4px}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--red);border-radius:5px}
.row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.quote{border-left:4px solid var(--red);background:var(--soft);border-radius:0 14px 14px 0;padding:12px 16px;margin:10px 0;font-size:16px}
.quote small{display:block;color:var(--mute);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.tools button{font-size:16px;min-height:46px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.head .tools{margin:0 0 14px}
.kpi.goal{background:var(--red);color:var(--redink)}
.kpi b span{font-size:.55em;opacity:.8}
.kpi .track{background:color-mix(in srgb,var(--redink) 30%,transparent);margin:8px 0 4px}.kpi .track i{background:var(--redink)}
.kpi small{display:block;font-size:13px;opacity:.85}
.sec{margin:30px 0 0}
.sec h2{font-size:24px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.hl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.hl li{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:16px}
.mx th,.mx td{vertical-align:middle}
.mx .num{text-align:center}
.mx small.sub{display:block;color:var(--mute);font-size:13px}
.hm{text-align:center;background:color-mix(in srgb,var(--red) calc(var(--p) * .5),var(--card));min-width:84px}
.hm b{display:block;font-family:Anuphan;font-size:17px}
.hm small{font-size:12px;opacity:.8}
.hm.na{background:none;color:var(--mute);font-size:13px}
.gh{margin:20px 0 4px;display:flex;align-items:center;gap:8px}.gh span{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 10px;font-size:14px}
.why{margin-top:8px;font-size:15px}
.chip{display:inline-block;background:var(--soft);border-radius:99px;padding:4px 12px;margin:2px;font-size:15px}
</style>
</head>
<body>

<div id="survey" class="wrap">
  <div class="top"><div class="brand"><i></i>เสียงคนดูแล</div><button type="button" class="aa" id="aa" aria-pressed="false">ตัวหนังสือใหญ่</button></div>
  <div class="pills" id="pills" aria-hidden="true"></div>
  <div id="screen"></div>
  <p class="err" id="err" role="alert"></p>
</div>
<div class="bar" id="bar"><div class="in"><button type="button" id="back">ย้อนกลับ</button><button type="button" class="go" id="next">เริ่มเลย</button></div></div>

<div id="team" class="wrap team" hidden>
  <div class="top"><div class="brand"><i></i>เสียงคนดูแล · ผลสำหรับทีม</div><span class="small"><a href="admin/">ตารางหลังบ้าน</a> · <a href="#">ไปหน้าแบบสอบถาม</a></span></div>
  <div id="gate">
    <h2>ใส่รหัสทีม</h2>
    <form id="gateForm" style="display:flex;gap:10px;max-width:440px"><input type="password" id="code" autocomplete="off" placeholder="รหัสทีม"><button class="go" style="flex:none">ดูผล</button></form>
    <p class="err" id="gateErr"></p>
  </div>
  <div id="dash" hidden></div>
</div>
<div class="toast" id="toast"></div>

<script src="schema.js"></script>
<script>
{
/* ---------- state ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src=(new URLSearchParams(location.search).get('src')||'').slice(0,40)||null;
let a={},i=-1,flow=[],sending=false;
const screen=$('screen'),err=$('err'),next=$('next'),back=$('back'),bar=$('bar'),pills=$('pills');
pills.innerHTML='<span><i></i></span>'.repeat(7);

const build=()=>{flow=[ROLE_Q,...(a.role?ROLES[a.role].qs:[])].filter(q=>!q.cond||q.cond(a))};
const qAt=k=>flow[k];
function save(){try{localStorage.setItem('care_v3',JSON.stringify({a,i}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem('care_v3')||'null');if(d&&d.a){a=d.a;i=d.i??-1}}catch(e){}}
function setBig(on){document.documentElement.classList.toggle('big',!!on);$('aa').setAttribute('aria-pressed',on?'true':'false');$('aa').textContent=on?'ตัวหนังสือปกติ':'ตัวหนังสือใหญ่'}
$('aa').onclick=()=>{a._big=!document.documentElement.classList.contains('big');setBig(a._big);save()};

const optHtml=(type,name,k,v,on,dis)=>`<label class="opt"><input type="${type}" name="${name}" value="${esc(k)}"${on?' checked':''}${dis?' disabled':''}><span>${v}</span></label>`;
function topOpts(q){const r=a.role,src=ROLES[r].qs.find(x=>x.id===q.from);return (a[q.from]||[]).map(k=>[k,src.o[k]])}
function needsTop(q){return topOpts(q).length>1}

function progress(){
  const total=flow.length,done=Math.max(0,i);
  const frac=i>=total?1:(a.role?done/total:0);
  [...pills.children].forEach((p,k)=>{const f=Math.min(1,Math.max(0,frac*7-k));p.firstChild.style.transform=`scaleX(${f})`});
}
function render(){
  err.textContent='';build();
  if(i>=flow.length){renderDone();return}
  bar.hidden=false;
  if(i<0){
    screen.innerHTML=`<div class="hero"><h1>ช่วยเล่าให้เราฟังหน่อย ว่าการดูแลผู้สูงอายุที่บ้านหนักตรงไหน</h1>
    <p>เราเป็นทีมนักศึกษากำลังออกแบบบริการช่วยครอบครัวดูแลผู้สูงอายุ ก่อนจะสร้างอะไร เราอยากฟังจากคนที่เจอเรื่องนี้จริง</p>
    <ul class="facts"><li>ประมาณ 5 นาที</li><li>ไม่ต้องใส่ชื่อ</li><li>ไม่มีคำตอบผิด</li></ul></div>
    <p class="small">ตอบได้ทั้งคนดูแล ผู้สูงอายุเอง ผู้ดูแลอาชีพ และลูกหลาน ข้อมูลใช้เพื่อการศึกษาในการแข่งขัน SPU AI Hackathon เท่านั้น ไม่เผยแพร่เป็นรายบุคคล และจะลบหลังจบการแข่งขัน การกด "เริ่มเลย" ถือว่ายินยอมตามนี้</p>`;
    back.style.display='none';next.textContent='เริ่มเลย';progress();return;
  }
  const q=qAt(i),n=flow.length;
  if(q.t==='top'&&!needsTop(q)){a.top=topOpts(q)[0]?.[0]||null;i+=goingBack?-1:1;save();render();return}
  let body='';
  if(q.t==='role')body=`<div class="opts roles">${Object.entries(ROLES).map(([k,r])=>optHtml('radio','role',k,`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${r.icon}</svg><span><b>${r.name}</b><em>${r.desc}</em></span>`,a.role===k)).join('')}</div>`;
  else if(q.t==='one')body=`<div class="opts">${Object.entries(q.o).map(([k,v])=>optHtml('radio',q.id,k,esc(v),a[q.id]===k)).join('')}</div>`;
  else if(q.t==='top')body=`<div class="opts">${topOpts(q).map(([k,v])=>optHtml('radio',q.id,k,esc(v),a.top===k)).join('')}</div>`;
  else if(q.t==='many'){const sel=a[q.id]||[];body=`<div class="opts">${Object.entries(q.o).map(([k,v])=>optHtml('checkbox',q.id,k,esc(v),sel.includes(k),q.max&&!sel.includes(k)&&sel.length>=q.max)).join('')}</div>`}
  else if(q.t==='scale')body=`<div class="scale">${[1,2,3,4,5].map(k=>optHtml('radio',q.id,k,k,a[q.id]===k)).join('')}</div><div class="ends"><span>${q.lo}</span><span>${q.hi}</span></div>`;
  else if(q.t==='text')body=`<textarea id="txt" maxlength="3000" placeholder="พิมพ์ที่นี่">${esc(a[q.id]||'')}</textarea>`;
  else if(q.t==='short')body=`<input type="text" id="txt" maxlength="300" value="${esc(a[q.id]||'')}">`;
  else if(q.t==='contact')body=`<input type="text" id="cname" maxlength="80" placeholder="ชื่อเล่น" value="${esc(a.contact_name||'')}"><input type="text" id="cval" class="mt" maxlength="120" placeholder="LINE ID หรือเบอร์โทร" value="${esc(a.contact||'')}">`;
  screen.innerHTML=`${q.t==='role'?'':`<p class="kick">ข้อ ${i} จาก ${n-1}</p>`}<h2>${esc(q.q)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}${body}`;
  screen.style.animation='none';void screen.offsetWidth;screen.style.animation='';
  back.style.display='';
  setNextLabel();progress();
  const t=$('txt');if(t&&matchMedia('(hover:hover)').matches)t.focus();
}
function setNextLabel(){
  const q=qAt(i);if(!q)return;
  const last=q.t!=='role'&&i===flow.length-1;
  if(last){next.textContent='ส่งคำตอบ';return}
  const optional=(q.t==='text'||q.t==='short')&&!q.req;
  next.textContent=optional&&!(a[q.id]||'').trim()?'ข้าม':'ต่อไป';
}
let goingBack=false,adv=null;
screen.addEventListener('change',e=>{
  const q=qAt(i),t=e.target;if(!q)return;err.textContent='';
  if(q.t==='role'){if(a.role!==t.value){const big=a._big;a={role:t.value};if(big!=null)a._big=big}if(ROLES[a.role].big&&a._big==null)setBig(true);else if(!ROLES[a.role].big&&a._big==null)setBig(false);build()}
  else if(q.t==='one'||q.t==='top')a[q.id]=t.value;
  else if(q.t==='scale')a[q.id]=+t.value;
  else if(q.t==='many'){
    let sel=[...screen.querySelectorAll('input:checked')].map(x=>x.value);
    const excl=['none'];
    if(excl.includes(t.value)&&t.checked)sel=[t.value];else sel=sel.filter(x=>!excl.includes(x));
    a[q.id]=sel;
    if(q.id==='pains'&&a.top&&!sel.includes(a.top))delete a.top;
    screen.querySelectorAll('input').forEach(x=>{x.checked=sel.includes(x.value);x.disabled=!!q.max&&!x.checked&&sel.length>=q.max});
  }
  save();
  if(['role','one','top','scale'].includes(q.t)){clearTimeout(adv);adv=setTimeout(go,260)}
});
screen.addEventListener('input',e=>{
  const q=qAt(i);if(!q)return;
  if(e.target.id==='txt')a[q.id]=e.target.value;
  if(e.target.id==='cname')a.contact_name=e.target.value;
  if(e.target.id==='cval')a.contact=e.target.value;
  save();setNextLabel();
});
screen.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();go()}});

function valid(q){
  if(!q)return '';
  if(['role','one','top','scale'].includes(q.t)&&(a[q.id]==null||a[q.id]===''))return 'แตะเลือกคำตอบก่อนนะ';
  if(q.t==='many'&&!(a[q.id]||[]).length)return 'เลือกอย่างน้อย 1 ข้อ';
  if(q.t==='text'&&q.req&&(a[q.id]||'').trim().length<4)return 'ช่วยเล่าสั้นๆ สักประโยคก็ได้';
  return '';
}
function go(){
  clearTimeout(adv);goingBack=false;
  if(i<0){i=0;save();render();return}
  build();const q=qAt(i),m=valid(q);if(m){err.textContent=m;return}
  if(i===flow.length-1){submit();return}
  i++;save();render();window.scrollTo({top:0});
}
next.onclick=go;
back.onclick=()=>{clearTimeout(adv);goingBack=true;if(i>=0){i--;save();render();window.scrollTo({top:0})}goingBack=false};

async function submit(){
  if(sending)return;sending=true;next.disabled=true;next.textContent='กำลังส่ง…';
  build();
  const ans={v:VERSION,role:a.role};
  flow.forEach(q=>{if(q.t==='contact'||q.t==='role')return;const v=a[q.id];if(v!=null&&v!==''&&!(Array.isArray(v)&&!v.length))ans[q.id]=typeof v==='string'?v.trim():v});
  if(a.top)ans.top=a.top;

function painStats(){

    top=cnt(rows,r=>r.answers.top===k);

  }).filter(p=>p.n>0).sort((a,b)=>b.score-a.score);
}

    try{sessionStorage.setItem('care_code',code)}catch(e){}
    ge.textContent='';$('gate').hidden=true;$('dash').hidden=false;renderDash();
  }catch(e){try{sessionStorage.removeItem('care_code')}catch(_){};$('gate').hidden=false;$('dash').hidden=true;ge.textContent='รหัสไม่ถูกต้อง หรือเชื่อมต่อไม่ได้'}
}
$('gateForm').addEventListener('submit',e=>{e.preventDefault();load()});

function route(){
  const t=location.hash==='#team';
  $('survey').hidden=t;bar.style.display=t?'none':'';$('team').hidden=!t;
  if(t){document.title='เสียงคนดูแล · ทีม';let c=null;try{c=sessionStorage.getItem('care_code')}catch(e){}if(c)load()}
  else{document.title='เสียงคนดูแล';render()}
}
restore();if(a._big!=null)setBig(a._big);else if(a.role&&ROLES[a.role]?.big)setBig(true);
window.addEventListener('hashchange',route);route();
}
</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SABAii.com</title>
  <meta name="description" content="เพิ่มงานง่าย รู้ว่าต้องทำอะไร และไม่พลาดกำหนดส่ง">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=Mali:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles/app.css">
  <script>/* มาจากหน้าแนะนำ (วงขาวขยายเต็มจอ) → เริ่มด้วยพื้นขาวเดียวกัน แล้วค่อยจางเข้าแบบสอบถาม ไม่มีกระพริบ */
  if (/[?&]from=landing/.test(location.search)) document.documentElement.classList.add('arrive');</script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- ชั้นหลัง = โน้ตหน้างาน (1 หน้า = 1 งาน) · ปัดขึ้นลงเปลี่ยนงาน ปัดซ้ายขวาเปลี่ยนโน้ต -->
  <div id="stage" aria-label="โน้ตหน้างาน"></div>
  <div id="note-ui">
    <button class="fab" id="note-back" aria-label="กลับหน้าแรก"></button>
    <div class="subjchip" id="note-chip"></div>
    <div class="pager" id="note-pager" aria-hidden="true"></div>
    <button class="fab" id="note-add" aria-label="เพิ่มโน้ต"></button>
    <button class="peek" id="note-peek"></button>
  </div>
  <!-- แผ่นล่าง 3 ระดับ = หน้าแรก -->
  <section id="sheet" aria-label="หน้าแรก">
    <div class="grab" tabindex="0" role="button" aria-label="ย่อ/ขยายแผ่นงาน (ดึงลงเพื่อดูโน้ตหน้างาน)"><i></i><small class="hint">ดึงลงเพื่อดูโน้ตหน้างาน</small></div>
    <div class="pane pane-home" id="pane-home"><p class="muted center" style="padding:40px 0">กำลังเปิด SABAii…</p></div>
    <div class="pane pane-note" id="pane-note"></div>
  </section>
  <main id="page" hidden></main>
  <nav id="nav" aria-label="เมนูหลัก">
    <a href="#/home" data-r="home"></a>
    <a href="#/tasks" data-r="tasks"></a>
    <a href="#/me" data-r="me"></a>
  </nav>
  <noscript>SABAii.com ต้องเปิด JavaScript</noscript>
</body>
</html>
